[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compgnn"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["datasets>=3,<5", "sentence-transformers>=3,<6", "numpy>=1.26,<3"]

[project.scripts]
compgnn-encode = "compgnn.encode:main"

[tool.setuptools.packages.find]
where = ["src"]
